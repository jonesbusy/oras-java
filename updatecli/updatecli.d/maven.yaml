---
name: Bump the Maven

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"

sources:
  mavenLatestVersion:
    kind: githubrelease
    spec:
      owner: "apache"
      repository: "maven"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      versionFilter:
        kind: regex
        pattern: "^maven-3\\.(\\d{1,2})\\.\\d+$"
    transformers:
      - trimprefix: "maven-"
  mavenLatestMinor:
    kind: githubrelease
    spec:
      owner: "apache"
      repository: "maven"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      versionFilter:
        kind: regex
        pattern: "^maven-3\\.(\\d{1,2})\\.\\d+$"
    transformers:
      - trimprefix: "maven-"
      - findsubmatch:
          pattern: "^(\\d+\\.\\d+)\\.\\d+$"
          captureindex: 1

targets:
  updatePom:
    name: "Update the Maven enforcer minor version"
    kind: file
    sourceid: mavenLatestMinor
    spec:
      file: pom.xml
      matchPattern: "<version>\\[(\\d+\\.\\d+(\\.\\d+)?),\\)</version>"
      replacePattern: '<version>[{{ source "mavenLatestMinor" }},)</version>'
    scmid: default
  updateSdkmanRC:
    name: "Update the value in the .sdkmanrc file"
    kind: file
    sourceid: mavenLatestVersion
    spec:
      file: .sdkmanrc
      matchPattern: "maven=(\\d+\\.\\d+(\\.\\d+)?)"
      replacePattern: 'maven={{ source "mavenLatestVersion" }}'
    scmid: default
  updateWorkflowFiles:
    name: "Update the value in the .sdkmanrc file"
    kind: file
    sourceid: mavenLatestVersion
    spec:
      file: .github/vars/maven-version.txt
      matchPattern: "(\\d+\\.\\d+(\\.\\d+)?)"
      replacePattern: '{{ source "mavenLatestVersion" }}'
    scmid: default

actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: 'Bump Maven {{ source "mavenLatestVersion" }}'
    spec:
      labels:
        - dependencies
